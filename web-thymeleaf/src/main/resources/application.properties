spring.application.name=web-thymeleaf

# Puerto de la aplicacion web (el backend usa 8080 y el frontend Angular 4200)
server.port=${PORT:8090}

# URL de la API REST. En Docker Compose es http://backend:8080
backend.url=${BACKEND_URL:http://localhost:8080}

# La sesion de esta aplicacion guarda el JWT del lado del servidor:
# el navegador solo recibe una cookie que JavaScript no puede leer.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
