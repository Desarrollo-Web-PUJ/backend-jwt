# Levanta el sistema completo en contenedores separados:
#   db (PostgreSQL) + backend (API REST, Spring Boot) + frontend (Angular + nginx)
#   + web (aplicacion Thymeleaf que consume la API con JWT).
#
# Requisitos: los repositorios "backend" y "frontend" clonados en la misma carpeta:
#   carpeta/
#   ├── backend/   <- este archivo
#   └── frontend/
#
# Uso (desde la carpeta backend):
#   cp .env.example .env
#   docker compose up --build
#
#   Aplicación:  http://localhost:4200
#   Swagger UI:  http://localhost:8080/swagger-ui.html
#   Web Thymeleaf: http://localhost:8090

services:

  db:
    image: postgres:17-alpine
    container_name: procesos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-proyecto_db}
      POSTGRES_USER: ${DB_USERNAME:-proyecto_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: procesos-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-proyecto_db}
      DB_USERNAME: ${DB_USERNAME:-proyecto_user}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env (mínimo 32 caracteres)}
      JWT_EXPIRACION_MINUTOS: ${JWT_EXPIRACION_MINUTOS:-60}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ../frontend
    container_name: procesos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"

  web:
    build:
      context: ./web-thymeleaf
    container_name: procesos-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${WEB_PORT:-8090}:8090"

volumes:
  datos-postgres:
