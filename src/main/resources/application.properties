spring.application.name=backend

# ------------------------------------------------------------------
# Base de datos (PostgreSQL)
# Los valores se leen de variables de entorno. Si no existen se usan
# los valores por defecto de desarrollo local. En Docker los define
# docker-compose.yml a partir del archivo .env (ver .env.example).
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/proyecto_db}
spring.datasource.username=${DB_USERNAME:proyecto_user}
spring.datasource.password=${DB_PASSWORD:Proyecto123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------
# Documentación de la API (springdoc-openapi)
#   Swagger UI:   http://localhost:8080/swagger-ui.html
#   OpenAPI JSON: http://localhost:8080/v3/api-docs
# ------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**

# ------------------------------------------------------------------
# Sesión HTTP: la cookie no es accesible desde JavaScript
# ------------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ------------------------------------------------------------------
# JWT: clave de firma (mínimo 32 caracteres) y vigencia del token.
# En producción la clave se define con la variable de entorno JWT_SECRET.
# ------------------------------------------------------------------
jwt.secret=${JWT_SECRET:clave-de-desarrollo-cambiar-en-produccion-123456}
jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}
