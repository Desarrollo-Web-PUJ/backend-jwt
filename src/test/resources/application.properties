# Configuración para las pruebas: base H2 en memoria (modo PostgreSQL),
# así las pruebas corren en cualquier equipo y en GitHub Actions sin PostgreSQL.
spring.datasource.url=jdbc:h2:mem:pruebas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
jwt.secret=clave-solo-para-pruebas-de-integracion-1234567890
jwt.expiracion-minutos=60
