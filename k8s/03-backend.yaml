# API REST (Spring Boot + Spring Security + JWT). Es sin estado, así que admite varias réplicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: procesos
  labels: {app: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      initContainers:
        # Espera a que PostgreSQL acepte conexiones (equivale a depends_on: service_healthy)
        - name: esperar-db
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo esperando la base; sleep 2; done"]
      containers:
        - name: backend
          image: procesos-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom: {configMapKeyRef: {name: procesos-config, key: DB_URL}}
            - name: DB_USERNAME
              valueFrom: {configMapKeyRef: {name: procesos-config, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: procesos-secretos, key: DB_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: procesos-secretos, key: JWT_SECRET}}
            - name: JWT_EXPIRACION_MINUTOS
              valueFrom: {configMapKeyRef: {name: procesos-config, key: JWT_EXPIRACION_MINUTOS}}
            # La JVM usa hasta el 60 % del límite de memoria del contenedor para el heap
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60
          readinessProbe:
            httpGet: {path: /v3/api-docs, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v3/api-docs, port: 8080}
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: procesos
spec:
  type: NodePort
  selector: {app: backend}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
