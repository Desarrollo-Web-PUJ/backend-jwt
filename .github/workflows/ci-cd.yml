# CI/CD del backend
#
#  1. pruebas     (GitHub, Ubuntu): compila y corre las pruebas unitarias y de
#                 integración (Spring Security, 401/403, aislamiento entre
#                 empresas) con Maven. No necesita PostgreSQL: usa H2.
#     web         (GitHub, Ubuntu): compila y prueba la aplicacion Thymeleaf
#                 (carpeta web-thymeleaf), en paralelo con el backend.
#  2. imagen      (GitHub, Ubuntu): construye las imagenes Docker del backend y
#                 de la aplicacion Thymeleaf.
#  3. despliegue  (runner propio del equipo, "self-hosted"): descarga backend y
#                 frontend y levanta con Docker Compose los componentes por
#                 separado: base de datos, backend, frontend y web Thymeleaf.
#
# El despliegue solo corre en un push a main y si la variable del repositorio
# DESPLIEGUE_HABILITADO vale "true" (Settings > Secrets and variables > Actions
# > Variables). Así el pipeline no queda esperando si no hay runner registrado.
# Secretos requeridos para el despliegue: DB_PASSWORD y JWT_SECRET.

name: CI/CD backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y correr las pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Guardar el reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-backend
          path: target/surefire-reports/

  web:
    name: Compilar y probar la web Thymeleaf
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-thymeleaf
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: web-thymeleaf/pom.xml

      - name: Compilar y correr las pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  imagen:
    name: Construir imágenes Docker
    needs: [pruebas, web]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen del backend
        run: docker build -t procesos-backend:${{ github.sha }} .

      - name: Construir la imagen de la web Thymeleaf
        run: docker build -t procesos-web:${{ github.sha }} web-thymeleaf

  despliegue:
    name: Desplegar con Docker Compose
    needs: imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DESPLIEGUE_HABILITADO == 'true'
    runs-on: self-hosted
    steps:
      - name: Descargar el backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Descargar el frontend
        uses: actions/checkout@v4
        with:
          repository: Desarrollo-Web-PUJ/frontend
          path: frontend

      - name: Crear el archivo .env con los secretos
        shell: pwsh
        working-directory: backend
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          @(
            "DB_NAME=proyecto_db",
            "DB_USERNAME=proyecto_user",
            "DB_PASSWORD=$env:DB_PASSWORD",
            "JWT_SECRET=$env:JWT_SECRET",
            "JWT_EXPIRACION_MINUTOS=60",
            "FRONTEND_PORT=4200",
            "BACKEND_PORT=8080",
            "WEB_PORT=8090",
            "DB_PORT=5433"
          ) | Set-Content -Path .env -Encoding utf8

      - name: Levantar los contenedores
        shell: pwsh
        working-directory: backend
        run: docker compose -p procesos up -d --build

      - name: Verificar el despliegue
        shell: pwsh
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $api = Invoke-WebRequest -Uri http://localhost:8080/v3/api-docs -UseBasicParsing
              $web = Invoke-WebRequest -Uri http://localhost:4200/ -UseBasicParsing
              $thy = Invoke-WebRequest -Uri http://localhost:8090/login -UseBasicParsing
              if ($api.StatusCode -eq 200 -and $web.StatusCode -eq 200 -and $thy.StatusCode -eq 200) { Write-Host "Despliegue verificado"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 10
          }
          docker compose -p procesos -f backend/docker-compose.yml logs --tail 50 backend
          throw "El sistema no respondió a tiempo"
